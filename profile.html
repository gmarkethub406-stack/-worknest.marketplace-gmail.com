<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create and manage your WorkNest professional profile.">
  <title>My Profile — WorkNest</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <a href="index.html" class="logo">Work<span>Nest</span></a>

    <div class="nav-buttons">
      <a href="index.html" class="btn btn-light">Home</a>
      <a href="jobs.html" class="btn btn-light">Browse Jobs</a>
      <a href="login.html" class="btn btn-light">Log In</a>
    </div>
  </header>

  <main>

    <section class="section">

      <div style="max-width: 700px; margin: 0 auto;">

        <div class="section-title">
          <h2>My WorkNest Profile</h2>
          <p>Build a professional profile clients and freelancers can trust.</p>
        </div>

        <div class="card">

          <form id="profileForm">

            <label for="fullName">Full Name</label>
            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="Your full name"
              required
              style="width:100%; padding:14px; margin:8px 0 20px; border:1px solid #e2e8f0; border-radius:8px; outline:none;"
            >

            <label for="headline">Professional Headline</label>
            <input
              type="text"
              id="headline"
              name="headline"
              placeholder="e.g. Full-Stack Web Developer"
              required
              style="width:100%; padding:14px; margin:8px 0 20px; border:1px solid #e2e8f0; border-radius:8px; outline:none;"
            >

            <label for="bio">About Me</label>
            <textarea
              id="bio"
              name="bio"
              rows="6"
              placeholder="Tell clients about your experience, skills and professional services..."
              required
              style="width:100%; padding:14px; margin:8px 0 20px; border:1px solid #e2e8f0; border-radius:8px; outline:none; resize:vertical;"
            ></textarea>

            <label for="skills">Skills</label>
            <input
              type="text"
              id="skills"
              name="skills"
              placeholder="e.g. Web Design, JavaScript, Marketing"
              required
              style="width:100%; padding:14px; margin:8px 0 20px; border:1px solid #e2e8f0; border-radius:8px; outline:none;"
            >

            <label for="category">Professional Category</label>
            <select
              id="category"
              name="category"
              required
              style="width:100%; padding:14px; margin:8px 0 20px; border:1px solid #e2e8f0; border-radius:8px; background:white;"
            >
              <option value="">Select a category</option>
              <option value="programming">Programming & Technology</option>
              <option value="design">Design & Creative</option>
              <option value="writing">Writing & Translation</option>
              <option value="marketing">Marketing</option>
              <option value="business">Business</option>
              <option value="video">Video & Animation</option>
              <option value="music">Music & Audio</option>
              <option value="consulting">Consulting</option>
              <option value="other">Other Services</option>
            </select>

            <label for="country">Country</label>
            <input
              type="text"
              id="country"
              name="country"
              placeholder="Your country"
              required
              style="width:100%; padding:14px; margin:8px 0 20px; border:1px solid #e2e8f0; border-radius:8px; outline:none;"
            >

            <label for="hourlyRate">Hourly Rate</label>
            <input
              type="number"
              id="hourlyRate"
              name="hourlyRate"
              placeholder="Enter your hourly rate"
              min="0"
              style="width:100%; padding:14px; margin:8px 0 20px; border:1px solid #e2e8f0; border-radius:8px; outline:none;"
            >

            <label for="website">Portfolio / Website</label>
            <input
              type="url"
              id="website"
              name="website"
              placeholder="https://example.com"
              style="width:100%; padding:14px; margin:8px 0 20px; border:1px solid #e2e8f0; border-radius:8px; outline:none;"
            >

            <button
              type="submit"
              class="btn btn-primary"
              style="width:100%;"
            >
              Save Profile
            </button>

          </form>

          <p style="text-align:center; margin-top:22px; color:#64748b;">
            Your profile will be connected to your WorkNest account during
            the backend setup.
          </p>

        </div>

      </div>

    </section>

  </main>

  <footer>
    <div class="copyright">
      © 2026 WorkNest. All rights reserved.
    </div>
  </footer>

  <script>
    document.getElementById("profileForm").addEventListener("submit", function(event) {
      event.preventDefault();

      alert(
        "Your profile page is ready. Profile data will be securely saved to the WorkNest database during the backend setup."
      );
    });
  </script>

</body>
</html>
